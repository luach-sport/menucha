# בקשת שריון מהאתר → Issue עם התגית New Lead + התראה לטלפון של המנהל.
# מופעל ע"י הממסר (relay/worker.js) דרך repository_dispatch.
name: פניה חדשה מהאתר

on:
  repository_dispatch:
    types: [new_lead]

permissions:
  contents: read
  issues: write

concurrency:
  group: leads
  cancel-in-progress: false

jobs:
  lead:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # הנתונים מהגולש עוברים רק דרך משתנה סביבה (לא משורבבים לפקודת shell)
      - name: פתיחת פניה ושליחת התראה
        run: node scripts/handle-lead.js
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRM_REPO: ${{ vars.CRM_REPO }}
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          CALLMEBOT_WHATSAPP_PHONE: ${{ secrets.CALLMEBOT_WHATSAPP_PHONE }}
          CALLMEBOT_WHATSAPP_APIKEY: ${{ secrets.CALLMEBOT_WHATSAPP_APIKEY }}
          CALLMEBOT_TELEGRAM_USER: ${{ secrets.CALLMEBOT_TELEGRAM_USER }}
          CALLMEBOT_VOICE_CALL: ${{ vars.CALLMEBOT_VOICE_CALL }}
          CALLMEBOT_VOICE: ${{ vars.CALLMEBOT_VOICE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
