# כשקובץ דירה ב-data/apartments/ משתנה (למשל אחרי Merge של דירה חדשה),
# מאחד את כל הדירות לקובץ data/apartments.json שהאתר קורא.
name: עדכון רשימת הדירות

on:
  push:
    branches: [main, master]
    paths:
      - 'data/apartments/**'
      - 'assets/js/pricing.js'
      - 'assets/js/amenities.js'
      - 'scripts/build-apartments.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: איחוד קובצי הדירות
        id: build
        run: node scripts/build-apartments.js

      - name: שמירה ברפוזיטורי
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apartments.json
          git commit -m "עדכון רשימת הדירות"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: בניית האתר מחדש
        if: steps.build.outputs.changed == 'true'
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || echo "GitHub Pages יתעדכן לבד מה-commit."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: דירות עם שגיאות
        if: steps.build.outputs.invalid != '0'
        run: |
          echo "::error::יש ${{ steps.build.outputs.invalid }} קובצי דירה עם שגיאות. הן לא מופיעות באתר — פירוט בשלב 'איחוד קובצי הדירות'."
          exit 1
